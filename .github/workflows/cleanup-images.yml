# Keeps the GHCR packages small: private packages count against the plan's storage quota,
# and the deploy workflows push one image per commit.

name: cleanup-images

on:
  schedule:
    - cron: '17 3 * * 0'   # Sundays, 03:17 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    strategy:
      # the -web package exists only after deploy-web's first run; don't let it fail the API's prune
      fail-fast: false
      matrix:
        # The API package is named after the repository (deploy.yml); the web one adds -web (deploy-web.yml).
        suffix: ['', '-web']
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}${{ matrix.suffix }}
          package-type: container
          min-versions-to-keep: 10
