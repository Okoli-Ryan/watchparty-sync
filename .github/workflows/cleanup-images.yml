# Keeps the GHCR package small: private packages count against the plan's storage quota,
# and the deploy workflow pushes one image per commit.

name: cleanup-images

on:
  schedule:
    - cron: '17 3 * * 0'   # Sundays, 03:17 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      # The package is named after the repository.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
