# Test, build one image per commit, push it to GHCR, then deploy that exact image to the VPS.
#
# Setup (secrets, VPS login, first run): server/DEPLOY.md

name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json
      # Integration tests start a throwaway Postgres with Testcontainers; the runner has Docker.
      - run: dotnet test server/WatchParty.slnx -c Release

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase, and the owner name here may not be.
      - id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}:${{ github.sha }}
            ${{ steps.ref.outputs.image }}:latest
          # Links the package to this repo, so the built-in token can manage it.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      IMAGE_REF: ${{ needs.build.outputs.image }}:${{ github.sha }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Send the compose file and deploy script
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p ~/watchparty'
          scp server/deploy/docker-compose.yml server/deploy/remote-deploy.sh "$VPS_USER@$VPS_HOST:~/watchparty/"

      - name: Pull and restart on the VPS
        run: ssh "$VPS_USER@$VPS_HOST" "bash ~/watchparty/remote-deploy.sh '$IMAGE_REF' ~/watchparty"

      - name: Check the public address
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::Repository variable APP_URL is not set, skipping the public check."; exit 0
          fi
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 8 "$APP_URL/health/ready" >/dev/null; then
              echo "up on attempt $attempt"; exit 0
            fi
            echo "attempt $attempt: not answering yet"; sleep 3
          done
          echo "::error::$APP_URL did not answer. Check Caddy and DNS."; exit 1
