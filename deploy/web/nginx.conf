# Two static sites in one container. Caddy on the VPS terminates HTTPS and forwards each
# domain to its loopback port (see deploy/web/DEPLOY.md).

# Headers are repeated inside each location because an add_header there replaces the server's.

# ---- the landing page: Next.js static export --------------------------------------
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/landing;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Hashed by Next: safe to cache for a year.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The design kit and photographs keep their names between builds: cache for a day.
  location /assets/ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    # /credits -> credits.html, / -> index.html
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
}

# ---- the web dashboard: Vite single-page app --------------------------------------
server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/dashboard;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  # A signed-in tool, not a page to be found by search (as vercel.json had it).
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Vite hashes every file under /assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }

  # Every other path is a route of the app: hand it index.html, never cached, so a deploy
  # reaches people on their next load.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /index.html;
  }
}
